# Makes a release of pmj: the program for each of three machines, and a file of their digests.
#
# A tag v<version> that is pushed makes the release. Run by hand, the workflow builds everything
# and releases nothing: what it built is kept with the run, to be looked at before a tag is pushed.
#
# Each step runs a script that also runs at a desk: scripts/release-tag.sh, scripts/aot-smoke.sh,
# scripts/glibc-floor.sh and scripts/release-assets.sh.
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

# Nothing here may write to the repository but the one job that makes the release.
permissions:
  contents: read

# Two runs for one tag would both try to make its release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  programs:
    name: pmj for ${{ matrix.rid }}
    strategy:
      matrix:
        include:
          # The oldest Ubuntu GitHub runs. A native program asks for the C library of the machine
          # that built it, and does not start on an older one.
          - os: ubuntu-22.04
            rid: linux-x64
            program: pmj
          - os: macos-latest
            rid: osx-arm64
            program: pmj
          - os: windows-latest
            rid: win-x64
            program: pmj.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Hold the tag to the version
      if: github.ref_type == 'tag'
      run: scripts/release-tag.sh "$GITHUB_REF_NAME"

    - name: Setup .NET (from global.json)
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        global-json-file: global.json

    # The native linker needs clang and zlib, which the runner image is not promised to keep.
    - name: Install what the native linker needs
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

    - name: Publish pmj natively and run it
      run: scripts/aot-smoke.sh ${{ matrix.rid }}

    - name: Hold the program to the C library a release promises to start on
      if: runner.os == 'Linux'
      run: scripts/glibc-floor.sh src/Packmoji.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/pmj 2.35

    - name: Keep the program
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ matrix.rid }}
        path: src/Packmoji.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.program }}
        if-no-files-found: error
        retention-days: 7

  assets:
    name: Name the programs and write their digests
    needs: programs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    # Each program arrives in a directory named for its runtime, which is how the script looks for it.
    - name: Fetch the three programs
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        path: built

    - name: Name them and write their digests
      run: scripts/release-assets.sh built assets

    - name: Keep the assets
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: assets
        path: assets/
        if-no-files-found: error
        retention-days: 7

  release:
    name: Make the release
    needs: assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Fetch the assets
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: assets
        path: assets

    # A release is made once: if one of this tag is there, this fails and changes nothing. Whoever
    # fetched a program holds it to its digest, and a version that changed would break that.
    - name: Make the release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        version="${GITHUB_REF_NAME#v}"
        {
          echo "The \`pmj\` program for three machines: Linux on x86-64 (glibc 2.35 or newer, which is Ubuntu 22.04), macOS on Apple silicon, and Windows on x86-64. Each asset is the program itself. Fetch the one for your machine, hold it to its digest, and on Linux and macOS mark it as a program: \`chmod +x\`."
          echo
          echo "The SHA-256 of each, which \`pmj-$version.sha256\` holds too:"
          echo
          echo '```'
          cat "assets/pmj-$version.sha256"
          echo '```'
          echo
          echo "How one is fetched and held to its digest: https://github.com/$GH_REPO/blob/$GITHUB_REF_NAME/docs/cli.md#getting-pmj"
        } > notes.md
        gh release create "$GITHUB_REF_NAME" --verify-tag --title "pmj $version" --notes-file notes.md assets/*
