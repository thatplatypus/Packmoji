# Checks every pull request, and main after a merge. The checks need no secret.
#
# Each job runs a script that also runs on a developer's machine, so a failure here can be
# had again at a desk: scripts/check.sh and scripts/aot-smoke.sh.
name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the run for the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup .NET (from global.json)
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        global-json-file: global.json

    - name: Build, test and report coverage
      run: scripts/check.sh --coverage

  aot:
    name: Native AOT (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup .NET (from global.json)
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        global-json-file: global.json

    # The native linker needs clang and zlib, which the runner image is not promised to keep.
    - name: Install what the native linker needs
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

    - name: Publish pmj natively and run it
      run: scripts/aot-smoke.sh ${{ matrix.rid }}
