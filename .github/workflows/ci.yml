# Checks every pull request, and main after a merge. The checks need no secret.
#
# Each job runs a script that also runs on a developer's machine, so a failure here can be
# had again at a desk: scripts/check.sh, scripts/aot-smoke.sh, scripts/glibc-floor.sh and
# scripts/real-compiler.sh.
#
# Windows is held to what pmj does there, which is to manage packages. No Emojicode compiler runs
# on it, so the native program builds nothing there, and the tests that stand a shell in for a
# compiler are skipped.
name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the run for the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test
            os: ubuntu-latest
            check: scripts/check.sh --coverage
          - name: Build and test (Windows)
            os: windows-latest
            check: scripts/check.sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup .NET (from global.json)
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        global-json-file: global.json

    - name: Build and test
      run: ${{ matrix.check }}

  real-compiler:
    name: The real compiler
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    # The script builds a container that holds Emojicode 1.0 beta 2 and the SDK, and runs in it
    # the tests that every other job has a made-up compiler for.
    - name: Build and run the sample projects with the released compiler
      run: scripts/real-compiler.sh

  aot:
    name: Native AOT (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Ubuntu a release is built on, for the reason release.yml gives.
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup .NET (from global.json)
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        global-json-file: global.json

    # The native linker needs clang and zlib, which the runner image is not promised to keep.
    - name: Install what the native linker needs
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

    - name: Publish pmj natively and run it
      run: scripts/aot-smoke.sh ${{ matrix.rid }}

    # Here and not only when a release is made, so that what would stop a release stops the
    # pull request that brought it.
    - name: Hold the program to the C library a release promises to start on
      if: runner.os == 'Linux'
      run: scripts/glibc-floor.sh src/Packmoji.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/pmj 2.35
